<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Chess Atlas
  </title>

  <link
    rel="stylesheet"
    href="style.css?v=4"
  >

</head>


<body>

  <main>

    <header
      class="atlas-header"
    >

      <h1>
        Chess Atlas
      </h1>

      <p>
        World × History × Strategy
      </p>

    </header>


    <section
      class="timeline-card"
      aria-label="Historical timeline"
    >

      <button
        id="timeline-up"
        class="timeline-arrow"
        aria-label="Move forward through time"
      >
        ▲
      </button>


      <div
        class="timeline-spine"
      >

        <span
          class="timeline-dot"
        ></span>


        <strong
          id="atlas-year"
        >
          2026 CE
        </strong>


        <span
          id="atlas-period"
        >
          Present
        </span>


        <small
          id="atlas-description"
        >
          Observed history reaches the simulation boundary.
        </small>

      </div>


      <button
        id="timeline-down"
        class="timeline-arrow"
        aria-label="Move backward through time"
      >
        ▼
      </button>

    </section>


    <nav
      class="atlas-modes"
      aria-label="Atlas representation"
    >

      <button
        class="atlas-mode active"
        data-mode="chess"
      >
        ♟ Chess
      </button>


      <button
        class="atlas-mode"
        data-mode="diplomacy"
      >
        🤝 Diplomacy
      </button>

<a
  class="atlas-mode"
  href="board.html"
>
  ◉ Futures
</a>
      

    </nav>


    <section
      id="game-space"
    >

      <div
        class="variant-control"
      >

        <div class="variant-label">
          <label
            for="game-variant"
          >
            Historical game
          </label>

          <small id="game-variant-context">
            Timeline default
          </small>
        </div>


        <select
          id="game-variant"
        >

          <option
            value=""
            disabled
          >
            Unavailable
          </option>

          <option
            value="chaturanga"
          >
            🇮🇳 Chaturanga
          </option>


          <option
            value="shatranj"
          >
            🕌 Shatranj
          </option>

<option
  value="acedrex"
>
  👑 Acedrex — Spain 1283
</option>

          <option
            value="modern"
            selected
          >
            ♟ Modern Chess
          </option>

        </select>

      </div>


      <div
        id="board"
      ></div>


      <div
        id="chess-controls"
      >

        


        <p
  id="status"
>
  Chaturanga: White to move
</p>


<div
  class="state-controls"
>

  <button
  id="state-back"
  type="button"
>
  ◀ Previous State
</button>


<select
  id="state-forward"
  aria-label="Choose future state"
>
  <option
    value=""
  >
    Future States
  </option>
</select>


<button
  id="reset"
  type="button"
>
  Reset Game
</button>

</div>

      </div>


      <section
        id="world-panel"
        class="world-panel"
        hidden
        aria-labelledby="world-mode-title"
      >
        <div class="world-panel-heading">
          <div>
            <p class="eyebrow">Common Atlas geography</p>
            <h2 id="world-mode-title">World Map</h2>
          </div>
          <div class="world-map-actions">
            <button id="reset-world" type="button">Reset World</button>
            <button id="focus-selection" type="button">Focus Selection</button>
          </div>
        </div>

        <p id="world-mode-status" class="world-map-status"></p>

        <div
          id="world-map"
          class="world-map"
          role="application"
          aria-label="Interactive Atlas world map"
        >
          <canvas class="world-map-canvas" aria-hidden="true"></canvas>
          <canvas class="world-map-hit-canvas" aria-hidden="true"></canvas>
        </div>

        <p
          id="world-map-summary"
          class="world-map-summary"
          aria-live="polite"
        >
          Loading the Atlas world map…
        </p>

        <small id="world-mode-detail"></small>
      </section>

    </section>

  </main>


<script
  src="stateGraph.js?v=2"
></script>

<script
  src="engine.js?v=3"
></script>

<script
  src="chess.js?v=5"
></script>

<script
  src="geography.js?v=1"
></script>

<script
  src="map-camera.js?v=1"
></script>

<script
  src="map-input.js?v=1"
></script>

<script
  src="map-renderer.js?v=1"
></script>

  <script
    src="atlas.js?v=1"
  ></script>

</body>

</html>
