<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chess Atlas — Backgammon</title><link rel="stylesheet" href="board-viewport.css?v=1"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101113;color:#eee;font-family:system-ui,sans-serif}.shell{max-width:760px;margin:auto;padding:10px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:inherit}.note,.status,.controls,.off-row,.moves{background:#191b1f;border:1px solid #34373d;border-radius:12px;padding:8px;margin:6px 0}.controls,.off-row,.moves{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.controls button,.controls select,.moves button{min-height:38px;font:inherit}.board{width:min(100%,680px);aspect-ratio:1.55;margin:6px auto;display:grid;grid-template-columns:repeat(6,1fr) .72fr repeat(6,1fr);grid-template-rows:1fr 1fr;gap:2px;padding:6px;background:#8b603c;border:3px solid #563820;overflow:hidden}.bg-point{position:relative;display:flex;align-items:center;flex-direction:column;min-width:0;padding:12px 1px 1px;color:#17120c}.bg-point.top{clip-path:polygon(0 0,100% 0,50% 100%);background:#d4a55e}.bg-point.bottom{clip-path:polygon(50% 0,100% 100%,0 100%);background:#c98b52;justify-content:flex-end;padding:1px 1px 12px}.bg-point small{position:absolute;font-weight:800;font-size:.55rem;opacity:.7;top:2px}.bg-point.bottom small{top:auto;bottom:2px}.checker{width:68%;max-width:34px;aspect-ratio:1;border-radius:50%;display:block;flex:0 0 auto;margin:-3px 0;box-shadow:0 1px 2px #0008;z-index:2}.checker.white{background:#f1eee6;border:1px solid #aaa}.checker.black{background:#171717;border:1px solid #444}.bg-point b{z-index:3;background:#222;color:#fff;border-radius:999px;padding:1px 5px;font-size:.65rem}.bg-bar{background:#573b2b;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-size:.68rem}.status span{display:block;margin-top:3px;opacity:.75}.moves{min-height:44px}.note{line-height:1.42}@media(max-width:520px){.shell{padding:5px}.board{width:100%;margin:4px auto;padding:4px;gap:1px;aspect-ratio:1.6}.checker{width:66%;margin:-3px 0}.moves button{font-size:.76rem;min-height:34px}.controls,.status,.off-row,.moves{margin:4px 0;padding:6px}.off-row{font-size:.86rem}}
</style></head><body><main class="shell"><header class="top"><h1>Backgammon</h1><a class="back" href="index.html" target="_top">← Atlas</a></header><div class="controls"><label>Black <select id="bg-opponent"><option value="human">Human</option><option value="random">Random legal</option><option value="heuristic">Atlas heuristic</option></select></label><button id="bg-roll" type="button">Start / Roll</button><button id="bg-reset" type="button">Reset</button><strong id="bg-dice">Dice: —</strong></div><div class="status"><strong id="bg-status">Opening roll</strong></div><div class="off-row"><span id="bg-off-white">White off: 0</span><span id="bg-off-black">Black off: 0</span></div><div id="bg-board" class="board" data-atlas-zoom-board aria-label="Backgammon board"></div><div id="bg-moves" class="moves" aria-label="Legal moves"></div><div class="note"><strong>Rules:</strong> standard 15-checker setup; dice, hits, bar priority and bearing off are implemented.</div></main><script src="atlas-time-state.js?v=1"></script><script src="atlas-game-shell.js?v=2"></script><script src="game-modules.js?v=1"></script><script src="game-agents.js?v=1"></script><script src="game-agent-heuristics.js?v=1"></script><script src="backgammon.js?v=1"></script><script src="backgammon-module.js?v=1"></script><script src="backgammon-play.js?v=3"></script><script src="board-viewport.js?v=1"></script></body></html>
