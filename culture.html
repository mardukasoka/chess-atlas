<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Atlas Culture Canvas</title>
  <link rel="stylesheet" href="culture.css?v=1">
</head>
<body>
  <main class="culture-canvas">
    <a id="return-map" class="return-map" href="index.html">← Return to map</a>
    <p class="eyebrow">GOD'S-EYE · DEEP-TIME EVIDENCE</p>
    <h1 id="culture-name">Culture</h1>
    <p id="culture-date" class="date"></p>
    <p id="culture-summary"></p>

    <section>
      <h2>What the map means</h2>
      <p id="culture-map-meaning"></p>
      <dl>
        <dt>Evidence</dt><dd id="culture-evidence"></dd>
        <dt>Confidence</dt><dd id="culture-confidence"></dd>
      </dl>
    </section>

    <section>
      <h2>Research resources</h2>
      <ul id="culture-sources"></ul>
    </section>
  </main>
  <script src="culture-data.js?v=1"></script>
  <script src="culture.js?v=1"></script>
</body>
</html>
