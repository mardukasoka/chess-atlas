<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archon Combat Prototype</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font:16px system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:12px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}button,select{font:inherit;min-height:42px;padding:7px 12px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#292929;border:1px solid #777;touch-action:none}.controls{display:grid;grid-template-columns:repeat(3,64px);gap:7px;justify-content:center;margin-top:10px}.controls button{min-height:52px}.attack{grid-column:3;grid-row:1/3}.status{text-align:center;margin:8px 0;min-height:24px}.hint{text-align:center;color:#bbb;font-size:13px}
</style>
</head>
<body><main class="wrap">
<div class="bar"><strong>Archon Combat Prototype</strong><label>Light <select id="light"></select></label><label>Dark <select id="dark"></select></label><button id="restart">Fight</button></div>
<div id="status" class="status"></div>
<canvas id="arena" width="960" height="540" aria-label="Archon combat arena"></canvas>
<div class="controls">
<button data-move="up">↑</button><button data-move="left">←</button><button data-move="right">→</button><button data-move="down">↓</button><button class="attack" id="attack">ATTACK</button>
</div>
<p class="hint">You control Light. Arrow/WASD keys move; Space attacks. Dark uses a simple pursuit AI. Touch controls work on mobile.</p>
</main>
<script src="archon-combatants.js"></script>
<script src="combat-state.js"></script>
<script>
(()=>{const C=window.ChessAtlasArchonCombatants,S=window.ChessAtlasCombatState,canvas=document.querySelector("#arena"),ctx=canvas.getContext("2d"),status=document.querySelector("#status"),ls=document.querySelector("#light"),ds=document.querySelector("#dark");
Object.keys(C.combatants.light).forEach(x=>ls.add(new Option(x,x)));Object.keys(C.combatants.dark).forEach(x=>ds.add(new Option(x,x)));ls.value="knight";ds.value="dragon";
let state,keys=new Set(),last=performance.now(),shotClock=0,aiClock=0,raf;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const fighter=r=>state.fighters.find(f=>f.role===r);
function start(){cancelAnimationFrame(raf);state=S.createCombatState({gameId:"archon",attacker:{id:"light",side:"light",type:ls.value},defender:{id:"dark",side:"dark",type:ds.value},profiles:{attacker:C.arenaProfile("light",ls.value,"dark",ds.value),defender:C.arenaProfile("dark",ds.value,"light",ls.value)}});state.projectiles=[];last=performance.now();status.textContent=ls.value+" vs "+ds.value;raf=requestAnimationFrame(loop)}
function fire(f){if(state.status!=="active"||f.cooldownMs>0)return;const target=state.fighters.find(x=>x!==f),dx=target.x-f.x,dy=target.y-f.y,d=Math.hypot(dx,dy)||1,p=f.profile||{};if(p.melee){if(d<72)damage(target,28);f.cooldownMs=450;return}const speed=420;state.projectiles.push({owner:f.sourceId,x:f.x,y:f.y,vx:dx/d*speed,vy:dy/d*speed,r:p.attack==="fiery-breath"?14:7,damage:p.attack==="fiery-breath"?18:22,life:1400});f.cooldownMs=p.attack==="fiery-breath"?330:550}
function damage(f,n){f.health=clamp(f.health-n,0,100);if(f.health<=0){state=S.finishCombat(state,state.fighters.find(x=>x!==f).sourceId);status.textContent=(state.winner==="light"?"Light":"Dark")+" wins — tap Fight to restart"}}
function update(dt){if(state.status!=="active")return;const a=fighter("attacker"),d=fighter("defender"),speed=220,dx=(keys.has("right")?1:0)-(keys.has("left")?1:0),dy=(keys.has("down")?1:0)-(keys.has("up")?1:0);a.x=clamp(a.x+dx*speed*dt,28,932);a.y=clamp(a.y+dy*speed*dt,28,512);for(const f of state.fighters)f.cooldownMs=Math.max(0,f.cooldownMs-dt*1000);const vx=a.x-d.x,vy=a.y-d.y,dist=Math.hypot(vx,vy)||1;if(dist>120){d.x=clamp(d.x+vx/dist*145*dt,28,932);d.y=clamp(d.y+vy/dist*145*dt,28,512)}aiClock-=dt*1000;if(aiClock<=0){fire(d);aiClock=500+Math.random()*450}for(const p of state.projectiles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1000;const target=p.owner==="light"?d:a;if(Math.hypot(p.x-target.x,p.y-target.y)<p.r+24){damage(target,p.damage);p.life=0}}state.projectiles=state.projectiles.filter(p=>p.life>0&&p.x>-20&&p.x<980&&p.y>-20&&p.y<560)}
function draw(){ctx.clearRect(0,0,960,540);ctx.fillStyle="#242424";ctx.fillRect(0,0,960,540);ctx.strokeStyle="#666";ctx.lineWidth=4;for(const [x,y,w,h] of [[350,110,70,150],[540,280,70,150],[450,225,60,90]])ctx.strokeRect(x,y,w,h);for(const f of state.fighters){ctx.beginPath();ctx.arc(f.x,f.y,24,0,Math.PI*2);ctx.fillStyle=f.side==="light"?"#eee":"#555";ctx.fill();ctx.strokeStyle="#aaa";ctx.stroke();ctx.fillStyle=f.side==="light"?"#111":"#fff";ctx.textAlign="center";ctx.font="12px system-ui";ctx.fillText(f.type[0].toUpperCase(),f.x,f.y+4);ctx.fillStyle="#111";ctx.fillRect(f.x-32,f.y-39,64,7);ctx.fillStyle="#ddd";ctx.fillRect(f.x-32,f.y-39,64*f.health/100,7)}for(const p of state.projectiles){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="#ddd";ctx.fill()}}
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();raf=requestAnimationFrame(loop)}
const map={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};addEventListener("keydown",e=>{if(map[e.key]){keys.add(map[e.key]);e.preventDefault()}if(e.code==="Space"){fire(fighter("attacker"));e.preventDefault()}});addEventListener("keyup",e=>{if(map[e.key])keys.delete(map[e.key])});document.querySelectorAll("[data-move]").forEach(b=>{const k=b.dataset.move;b.addEventListener("pointerdown",()=>keys.add(k));b.addEventListener("pointerup",()=>keys.delete(k));b.addEventListener("pointercancel",()=>keys.delete(k))});document.querySelector("#attack").addEventListener("pointerdown",()=>fire(fighter("attacker")));document.querySelector("#restart").addEventListener("click",start);start()})();
</script></body></html>
