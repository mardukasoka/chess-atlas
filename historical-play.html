<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess Atlas — Historical Games</title>
  <link rel="stylesheet" href="historical-play.css?v=2">
  <link rel="stylesheet" href="board-viewport.css?v=1">
</head>
<body>
  <main class="history-shell">
    <header class="history-header"><div><p class="eyebrow">Chess Atlas · Games Through Time</p><h1 id="history-title">Historical Game</h1><p id="history-era" class="subtitle"></p></div><a class="back-link" href="index.html">← Timeline</a></header>
    <section class="control-card" aria-label="Game controls">
      <label>Game <select id="history-mode"><option value="ur">Royal Game of Ur</option><option value="senet">Senet — Kendall-style reconstruction</option><option value="morris">Nine Men's Morris</option><option value="konane">Kōnane</option></select></label>
      <label>Opponent <select id="history-opponent"><option value="human">Human</option><option value="agent">Atlas agent · Black</option></select></label>
      <button id="history-reset" type="button">Reset</button>
      <button id="history-state-back" type="button">← Previous state</button>
      <label>Forward <select id="history-state-forward"><option value="">Future states</option></select></label>
      
    </section>
    <section class="status-card" aria-live="polite"><strong id="history-status">Loading…</strong><span id="history-detail"></span></section>
    <section class="game-card"><div id="history-actions" class="actions"></div><div id="history-board" class="history-board" data-atlas-zoom-board></div></section>
    <details class="note-card"><summary>History, rules &amp; evidence</summary><strong id="history-note-title"></strong><span id="history-note"></span></details>
  </main>
  <script src="atlas-time-state.js?v=1"></script><script src="atlas-game-shell.js?v=1"></script><script src="randomizer.js?v=1"></script><script src="stateGraph.js?v=2"></script><script src="game-agent.js?v=1"></script><script src="historical-games.js?v=2"></script><script src="ur-agent.js?v=1"></script><script src="senet.js?v=2"></script><script src="graph-games.js?v=1"></script><script src="game-modules.js?v=1"></script><script src="morris-module.js?v=1"></script><script src="morris-agent.js?v=1"></script><script src="konane.js?v=1"></script><script src="konane-agent.js?v=1"></script><script src="historical-route.js?v=1"></script><script src="historical-play.js?v=4"></script><script src="historical-agent-integration.js?v=1"></script><script src="board-viewport.js?v=1"></script>
  <script src="game-catalogue.js?v=3"></script>
</body>
</html>
