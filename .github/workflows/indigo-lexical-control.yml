name: Indigo lexical retrieval control
on:
  push:
    branches: [indigo/knowledge-memory-benchmark]
    paths:
      - 'benchmarks/knowledge-memory/lexical_control.py'
      - 'benchmarks/knowledge-memory/fixtures/**'
      - '.github/workflows/indigo-lexical-control.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indigo-lexical-control
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic retrieval control
        run: python benchmarks/knowledge-memory/lexical_control.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indigo-lexical-control
          path: reports/lexical-control.json
          if-no-files-found: ignore
          retention-days: 3
