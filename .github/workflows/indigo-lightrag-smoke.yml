name: Indigo LightRAG storage smoke
on:
  push:
    branches: [indigo/knowledge-memory-benchmark]
    paths:
      - 'benchmarks/knowledge-memory/lightrag_smoke.py'
      - '.github/workflows/indigo-lightrag-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indigo-lightrag-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LightRAG
        run: python -m pip install 'lightrag-hku' 
      - name: Run zero-inference storage smoke
        run: python benchmarks/knowledge-memory/lightrag_smoke.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indigo-lightrag-smoke
          path: reports/lightrag-smoke.json
          if-no-files-found: ignore
          retention-days: 3
